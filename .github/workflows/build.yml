# Builds Tidings for Linux (x86_64) and macOS (universal).
#
# - Push a tag like v0.2.0: builds, then publishes a GitHub release with every
#   package, SHA256SUMS and the matching CHANGELOG.md section.
# - Run it by hand from the Actions tab: builds and keeps the packages as artifacts.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Jobs may only read the repository. The release job asks for more itself.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code.
# The comment after each hash names the version it was taken from.

jobs:
  # Known vulnerabilities in dependencies stop a release.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm audit (what ships in the app)
        run: npm audit --omit=dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo audit
        # Fails on vulnerabilities. "Unmaintained" and "unsound" notices are printed
        # as warnings; they come from Tauri's GTK dependencies.
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
            bundles: target/release/bundle
          - os: macos-latest
            args: '--target universal-apple-darwin'
            bundles: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check version
        # The tag name goes in through the environment, not into the script text.
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/check-version.sh "$TAG"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # apt mirrors sometimes hang; fail fast and retry instead of waiting for hours.
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo timeout 300 apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                   libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev file \
              && exit 0
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm run check
      # --locked: fail if Cargo.lock does not match Cargo.toml, so the build uses
      # exactly the dependency versions that were reviewed.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - run: npx tauri build ${{ matrix.args }}

      - name: Make portable tarball
        if: runner.os == 'Linux'
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          d="tidings-$v-linux-x86_64"
          mkdir -p "$d/icons"
          cp src-tauri/target/release/tidings scripts/linux/install.sh scripts/linux/tidings.desktop "$d/"
          cp src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png "$d/icons/"
          tar -czf "src-tauri/target/release/bundle/$d.tar.gz" "$d"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tidings-${{ runner.os }}
          path: |
            src-tauri/${{ matrix.bundles }}/deb/*.deb
            src-tauri/${{ matrix.bundles }}/rpm/*.rpm
            src-tauri/${{ matrix.bundles }}/appimage/*.AppImage
            src-tauri/${{ matrix.bundles }}/dmg/*.dmg
            src-tauri/${{ matrix.bundles }}/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect files and checksums
        run: |
          mkdir upload
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.tar.gz' \) -exec cp {} upload/ \;
          (cd upload && sha256sum * > SHA256SUMS)
          ls -la upload

      - name: Write release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          | System | File | How |
          |---|---|---|
          | Ubuntu, Debian, Mint, Pop!_OS | `.deb` | `sudo apt install ./Tidings_*_amd64.deb` |
          | Fedora, openSUSE | `.rpm` | `sudo dnf install ./Tidings-*.x86_64.rpm` |
          | CachyOS, Arch, Manjaro | `.tar.gz` | `sudo pacman -S --needed webkit2gtk-4.1 gtk3 xdotool`, then unpack and run `./install.sh` |
          | Any Linux | `.AppImage` | `chmod +x Tidings_*.AppImage` and run it |
          | macOS 12.3+ | `.dmg` | Open the disk image and drag Tidings to Applications |

          The macOS app is not signed. The first time, right-click it and choose **Open**,
          or run `xattr -dr com.apple.quarantine /Applications/Tidings.app`.

          Verify downloads with `sha256sum -c SHA256SUMS`.
          NOTES
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" upload/* \
            --title "Tidings ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
