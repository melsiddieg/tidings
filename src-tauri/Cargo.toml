[package]
name = "tidings"
version = "0.1.0"
description = "A private, secure RSS and Atom feed reader"
repository = "https://github.com/melsiddieg/tidings"
homepage = "https://github.com/melsiddieg/tidings"
authors = ["Mohammed Abdallah"]
edition = "2021"
rust-version = "1.89"
resolver = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate", "socks", "http2", "charset"] }
feed-rs = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
ammonia = "4"
dom_smoothie = "0.19"
dom_query = "0.29"
quick-xml = "0.38"
url = "2"
base64 = "0.22"
lru = "0.16"
open = "5"
thiserror = "2"
chrono = "0.4"
log = "0.4"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
